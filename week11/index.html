<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ชื่อร้าน</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- แก้ชื่อร้านในแท็ก h1 และ title ให้ตรงกับร้านของกลุ่ม -->
  <h1>ชื่อร้าน</h1>
  <h2>สินค้าทั้งหมด</h2>
  <div id="products"></div>

  <h2>ตะกร้าสินค้า <span id="cart-count"></span></h2>
  <ul id="cart"></ul>
  <p class="total">รวม <span id="cart-total">0</span> บาท</p>

  <h2>ติดต่อร้าน</h2>
  <!-- TODO 2: เบอร์สมมติของร้าน และพิกัดหรือชื่อสถานที่ของร้านหลัง destination= -->
  <a class="button" href="tel:0800000000">โทรหาร้าน</a>
  <a class="button" href="https://www.google.com/maps/dir/?api=1&destination=Laplae+Uttaradit">นำทางไปร้าน</a>
  <!-- ส่วนท้าทาย (ก): เพิ่มปุ่มชวนเพื่อนมาซื้อตรงนี้ได้ เช่น <button class="button" onclick="shareShop()">ชวนเพื่อนมาซื้อ</button> -->
  <!-- ส่วนท้าทาย (ข): เพิ่มปุ่มระยะทางไปร้านตรงนี้ได้ เช่น <button class="button" onclick="checkDistance()">ระยะทางไปร้าน</button> -->

  <h2>แนบสลิปการโอนเงิน</h2>
  <!-- TODO 3: เพิ่ม accept="image/*" ในแท็ก input ให้รับเฉพาะไฟล์รูป -->
  <input type="file" onchange="showPreview(this)">
  <img id="slip" alt="รูปสลิปที่เลือก">
  <script src="app.js"></script>
</body>
</html>
