<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ชื่อร้าน</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2e7d32">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body>
  <h1>ชื่อร้าน</h1>
  <h2>สินค้าทั้งหมด</h2>
  <div id="products"></div>

  <h2>ตะกร้าสินค้า</h2>
  <ul id="cart"></ul>
  <p class="total">รวม <span id="cart-total">0</span> บาท</p>

  <h2>ชำระเงิน</h2>
  <p>สแกน QR พร้อมเพย์ด้วยแอปธนาคาร ยอด <span id="pay-total">0</span> บาท</p>
  <div id="qr"></div>

  <h2>แนบสลิปการโอนเงิน</h2>
  <input type="file" accept="image/*" onchange="showPreview(this)">
  <img id="slip" alt="รูปสลิปที่ถ่าย">

  <h2>ส่งออเดอร์</h2>
  <a class="button" id="send-line" href="#">ส่งออเดอร์ทาง LINE</a>
  <button class="button" onclick="copyOrder()">คัดลอกข้อความออเดอร์</button>

  <h2>ติดต่อร้าน</h2>
  <a class="button" href="tel:0800000000">โทรหาร้าน</a>
  <a class="button" href="https://www.google.com/maps/dir/?api=1&destination=Laplae+Uttaradit">นำทางไปร้าน</a>
  <script src="qrcode.min.js"></script>
  <script src="promptpay-helper.js"></script>
  <script src="app.js"></script>
</body>
</html>
