<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ชื่อร้าน</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>ชื่อร้าน</h1>
  <div class="card">
    <img src="images/product1.jpg" alt="สินค้า 1">
    <div>
      <h3>ชื่อสินค้า</h3>
      <p class="price">0 บาท</p>
      <div class="qty">
        <button id="minus">-</button>
        <span id="qty">1</span>
        <button id="plus">+</button>
      </div>
    </div>
  </div>
  <p class="total">รวม <span id="total">0</span> บาท</p>
  <p id="note"></p>
  <script src="app.js"></script>
</body>
</html>
